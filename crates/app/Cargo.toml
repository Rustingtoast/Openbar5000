[package]
name = "app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Openbar5000 application binary: wires the engine to the UI"

[[bin]]
name = "openbar5000"
path = "src/main.rs"

[dependencies]
engine.workspace = true
ui.workspace = true
plugin-host.workspace = true
slint.workspace = true
crossbeam-channel.workspace = true
discord-rich-presence.workspace = true
rfd.workspace = true
rand.workspace = true
arboard.workspace = true
serde.workspace = true
serde_json.workspace = true
ureq.workspace = true
image.workspace = true
rusqlite.workspace = true
notify.workspace = true
chrono.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true


# OS media keys / now-playing integration (issue #17). On Linux it talks
# MPRIS over the pure-Rust zbus instead of libdbus, so building needs no
# extra system packages.
[target.'cfg(target_os = "windows")'.dependencies]
souvlaki = { version = "0.8", default-features = false }

# macOS talks to MediaPlayer.framework directly through the maintained
# objc2 bindings: souvlaki's macOS side still uses `cocoa`/`block` 0.1,
# which future Rust versions will reject.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSDictionary", "NSValue", "NSObject"] }
objc2-media-player = { version = "0.3", default-features = false, features = ["std", "block2", "MPRemoteCommandCenter", "MPRemoteCommand", "MPRemoteCommandEvent", "MPNowPlayingInfoCenter", "MPMediaItem", "MPMediaEntity"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
souvlaki = { version = "0.8", default-features = false, features = ["use_zbus"] }

[target.'cfg(windows)'.dependencies]
slint = { workspace = true, features = ["raw-window-handle-06"] }
raw-window-handle = "0.6"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
