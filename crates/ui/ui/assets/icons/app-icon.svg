<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2416"/>
      <stop offset="1" stop-color="#1c1108"/>
    </linearGradient>
    <linearGradient id="boxGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d98b3f"/>
      <stop offset="1" stop-color="#9c5a20"/>
    </linearGradient>
    <linearGradient id="lidGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8a158"/>
      <stop offset="1" stop-color="#c97a26"/>
    </linearGradient>
  </defs>

  <!-- backdrop, drawn rather than left transparent so the icon reads well
       in the macOS Dock / Windows taskbar / Linux launchers alike -->
  <rect x="0" y="0" width="256" height="256" rx="56" fill="url(#bgGrad)"/>

  <!-- a music note escaping the box -->
  <g transform="translate(150,46) rotate(-12)">
    <rect x="9" y="-6" width="7" height="60" rx="3.5" fill="#fff4de"/>
    <path d="M16 -6 C 44 -2, 46 20, 22 30" fill="none" stroke="#fff4de" stroke-width="7" stroke-linecap="round"/>
    <ellipse cx="4" cy="52" rx="15" ry="11" fill="#fff4de" transform="rotate(-18 4 52)"/>
  </g>

  <!-- music box: lid, seam, body -->
  <rect x="46" y="116" width="164" height="32" rx="11" fill="url(#lidGrad)"/>
  <rect x="46" y="134" width="164" height="14" fill="#7a4518" opacity="0.35"/>
  <rect x="46" y="146" width="164" height="78" rx="12" fill="url(#boxGrad)"/>

  <!-- winding key on the front -->
  <circle cx="128" cy="185" r="12" fill="#fff4de" stroke="#7a4518" stroke-width="4"/>
  <circle cx="128" cy="185" r="3.5" fill="#7a4518"/>
</svg>
