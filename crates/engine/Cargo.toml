[package]
name = "engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Openbar5000 playback engine: decode -> DSP -> output pipeline and playlist state"

[dependencies]
plugin-api.workspace = true
symphonia.workspace = true
lofty.workspace = true
cpal.workspace = true
ringbuf.workspace = true
crossbeam-channel.workspace = true
tracing.workspace = true
rustfft.workspace = true
rand.workspace = true
image.workspace = true

# Realtime scheduling for the audio thread, from RTKit or the desktop
# portal (see `output::realtime`). zbus is already built for Slint's tray
# icon; its blocking API is what's added.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
libc = "0.2"

[dev-dependencies]
tracing-subscriber.workspace = true
