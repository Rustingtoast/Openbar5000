[workspace]
resolver = "2"
members = [
    "crates/plugin-api",
    "crates/plugin-host",
    "crates/engine",
    "crates/ui",
    "crates/app",
    "plugins/gain-dsp",
]

[workspace.package]
version = "0.7.1-alpha"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Rustingtoast/Openbar5000"

[workspace.dependencies]
plugin-api = { path = "crates/plugin-api" }
plugin-host = { path = "crates/plugin-host" }
engine = { path = "crates/engine" }
ui = { path = "crates/ui" }

symphonia = { version = "0.6", features = ["mp3", "flac", "wav", "vorbis", "aac", "alac", "isomp4", "ogg"] }
cpal = "0.18"
lofty = "0.25"
libloading = "0.8"
crossbeam-channel = "0.5"
ringbuf = "0.4"
rfd = "0.15"
tracing = "0.1"
tracing-subscriber = "0.3"
# Drawn by Skia on every platform: Metal on macOS, Direct3D 12 on Windows,
# Vulkan (or OpenGL) on Linux -- each system's own GPU interface, where
# Slint's default femtovg renderer goes through OpenGL everywhere (which
# macOS only emulates, on top of Metal). The software renderer stays as the
# last resort when no GPU drawing can be set up at all. Slint's defaults are
# off so femtovg isn't built too; the rest of its defaults are listed here.
slint = { version = "1.18", default-features = false, features = [
    "std",
    "backend-default",
    "renderer-skia",
    "renderer-software",
    "accessibility",
    "compat-1-2",
    "system-tray",
] }
slint-build = "1.18"
rustfft = "6.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
rusqlite = { version = "0.40", features = ["bundled"] }
discord-rich-presence = "1.1"
rand = "0.10"
arboard = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3"
# Watches the media library's music folders for changes.
notify = "8"
# Local date, for the holiday logos.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# Slint's winit backend with two fixes: on X11 it drew every frame twice,
# and a window icon loaded at run time never showed (see
# `patches/README.md`). Remove once Slint ships the fixes.
[patch.crates-io]
i-slint-backend-winit = { path = "patches/i-slint-backend-winit" }
