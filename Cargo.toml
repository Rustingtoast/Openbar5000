[workspace]
resolver = "2"
members = [
    "crates/plugin-api",
    "crates/plugin-host",
    "crates/engine",
    "crates/ui",
    "crates/app",
    "plugins/gain-dsp",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Rustingtoast/Openbar5000"

[workspace.dependencies]
plugin-api = { path = "crates/plugin-api" }
plugin-host = { path = "crates/plugin-host" }
engine = { path = "crates/engine" }
ui = { path = "crates/ui" }

symphonia = { version = "0.6", features = ["mp3", "flac", "wav", "vorbis", "aac", "alac", "isomp4", "ogg"] }
cpal = "0.18"
lofty = "0.25"
libloading = "0.8"
crossbeam-channel = "0.5"
ringbuf = "0.4"
rfd = "0.15"
tracing = "0.1"
tracing-subscriber = "0.3"
slint = "1.17"
slint-build = "1.17"
rustfft = "6.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
rusqlite = { version = "0.40", features = ["bundled"] }
discord-rich-presence = "1.1"
rand = "0.10"
arboard = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3"
