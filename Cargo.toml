[workspace]
resolver = "2"
members = [
    "crates/plugin-api",
    "crates/plugin-host",
    "crates/engine",
    "crates/ui",
    "crates/app",
    "plugins/gain-dsp",
]

[workspace.package]
version = "0.8.0-beta"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Rustingtoast/Openbar5000"

[workspace.dependencies]
plugin-api = { path = "crates/plugin-api" }
plugin-host = { path = "crates/plugin-host" }
engine = { path = "crates/engine" }
ui = { path = "crates/ui" }

symphonia = { version = "0.6", features = ["mp3", "flac", "wav", "vorbis", "aac", "alac", "isomp4", "ogg"] }
cpal = "0.18"
lofty = "0.25"
libloading = "0.8"
crossbeam-channel = "0.5"
ringbuf = "0.4"
rfd = "0.15"
tracing = "0.1"
tracing-subscriber = "0.3"
# Drawn by Skia on every platform: Metal on macOS, Direct3D 12 on Windows,
# Vulkan (or OpenGL) on Linux -- each system's own GPU interface, where
# Slint's default femtovg renderer goes through OpenGL everywhere (which
# macOS only emulates, on top of Metal). The software renderer stays as the
# last resort when no GPU drawing can be set up at all. Slint's defaults are
# off so femtovg isn't built too; the rest of its defaults are listed here.
slint = { version = "1.18", default-features = false, features = [
    "std",
    "backend-default",
    "renderer-skia",
    "renderer-software",
    "accessibility",
    "compat-1-2",
    "system-tray",
] }
slint-build = "1.18"
rustfft = "6.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
rusqlite = { version = "0.40", features = ["bundled"] }
discord-rich-presence = "1.1"
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3"
# Watches the media library's music folders for changes.
notify = "8"
# Local date, for the holiday logos.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# Debug builds decode audio with symphonia optimized: unoptimized, it made
# a 4-minute MP3's waveform take 1.4 s to show instead of 0.5 s. The app's
# own code stays unoptimized, to debug.
[profile.dev.package.symphonia]
opt-level = 3
[profile.dev.package.symphonia-bundle-flac]
opt-level = 3
[profile.dev.package.symphonia-bundle-mp3]
opt-level = 3
[profile.dev.package.symphonia-codec-aac]
opt-level = 3
[profile.dev.package.symphonia-codec-adpcm]
opt-level = 3
[profile.dev.package.symphonia-codec-alac]
opt-level = 3
[profile.dev.package.symphonia-codec-pcm]
opt-level = 3
[profile.dev.package.symphonia-codec-vorbis]
opt-level = 3
[profile.dev.package.symphonia-common]
opt-level = 3
[profile.dev.package.symphonia-core]
opt-level = 3
[profile.dev.package.symphonia-format-isomp4]
opt-level = 3
[profile.dev.package.symphonia-format-mkv]
opt-level = 3
[profile.dev.package.symphonia-format-ogg]
opt-level = 3
[profile.dev.package.symphonia-format-riff]
opt-level = 3
[profile.dev.package.symphonia-metadata]
opt-level = 3

# Slint's winit backend with seven changes (see `patches/README.md`): on X11
# it drew every frame twice; a window icon loaded at run time never showed;
# on Wayland no window icon showed at all; every window, shown or not, was
# made at start-up; in a Flatpak on Wayland there was no clipboard; on
# Windows a window given its size came out short by its menu bar; and a
# frame that failed, as after a GPU driver reset, ended the app. And Slint's
# Skia renderer with one: once the GPU device was lost, it crashed. Remove
# once Slint ships the fixes.
[patch.crates-io]
i-slint-backend-winit = { path = "patches/i-slint-backend-winit" }
i-slint-renderer-skia = { path = "patches/i-slint-renderer-skia" }
